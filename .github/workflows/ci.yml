name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project CleaningApp.xcodeproj \
            -scheme CleaningApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO

      - name: Test
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -o '[A-F0-9-]\{36\}')
          echo "Using simulator: $UDID"
          xcodebuild test \
            -project CleaningApp.xcodeproj \
            -scheme CleaningAppTests \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO
